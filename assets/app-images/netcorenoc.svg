<svg xmlns="http://www.w3.org/2000/svg"
    width="1000" height="560" viewBox="0 0 1000 560">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#10213b"/>
        <stop offset="1" stop-color="#60a5fa"/>
      </linearGradient>
      <radialGradient id="light">
        <stop offset="0" stop-color="#60a5fa" stop-opacity=".8"/>
        <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
      </linearGradient>
    </defs>

    <rect width="1000" height="560" rx="36" fill="url(#bg)"/>
    <circle cx="800" cy="100" r="300" fill="url(#light)" opacity=".65"/>
    <circle cx="100" cy="500" r="280" fill="url(#light)" opacity=".4"/>

    <g stroke="#ffffff" stroke-opacity=".13" fill="none">
      <path d="M0 100 H1000 M0 200 H1000 M0 300 H1000 M0 400 H1000 M0 500 H1000"/>
      <path d="M100 0 V560 M200 0 V560 M300 0 V560 M400 0 V560 M500 0 V560 M600 0 V560 M700 0 V560 M800 0 V560 M900 0 V560"/>
      <circle cx="500" cy="255" r="190" stroke-width="2"/>
      <circle cx="500" cy="255" r="155" stroke-width="2"/>
      <circle cx="500" cy="255" r="120" stroke-width="1"/>
    </g>

    <rect x="315" y="95" width="370" height="300" rx="55"
      fill="url(#glass)" stroke="#ffffff" stroke-opacity=".6" stroke-width="3"/>

    <circle cx="500" cy="230" r="85" fill="#07111f" fill-opacity=".55"
      stroke="#ffffff" stroke-opacity=".65" stroke-width="3"/>

    <path d="M455 230 L485 260 L550 190"
      fill="none" stroke="#ffffff" stroke-width="15"
      stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

    <text x="500" y="345" text-anchor="middle"
      font-family="Arial,sans-serif" font-size="34"
      font-weight="900" fill="#ffffff">NETCORE NOC</text>

    <text x="500" y="445" text-anchor="middle"
      font-family="Arial,sans-serif" font-size="22"
      font-weight="bold" letter-spacing="8" fill="#ffffff" opacity=".85">
      X DIGITAL TECHNOLOGY
    </text>

    <text x="500" y="500" text-anchor="middle"
      font-family="Arial,sans-serif" font-size="18"
      fill="#ffffff" opacity=".65">PREMIUM APPLICATION SERIES</text>

    <text x="920" y="65" text-anchor="end"
      font-family="Arial,sans-serif" font-size="24"
      fill="#ffffff" opacity=".8">#18</text>
    </svg>